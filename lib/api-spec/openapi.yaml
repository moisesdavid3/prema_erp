openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for a simple private inventory and sales app
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: companies
    description: Company operations
  - name: products
    description: Product and inventory operations
  - name: sales
    description: Sales operations
  - name: clients
    description: Client operations
  - name: purchases
    description: Purchase and stock operations
  - name: reports
    description: Dashboard and report operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List companies the user belongs to
      responses:
        "200":
          description: Companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List suppliers for the company (from table and products)
      responses:
        "200":
          description: Suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplierSummary"
    post:
      operationId: createSupplier
      tags: [suppliers]
      summary: Create a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "201":
          description: Supplier created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Update a supplier (details and optional rename)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSupplierInput"
      responses:
        "200":
          description: Supplier updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSupplier
      tags: [suppliers]
      summary: Delete a supplier and clear it from its products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteSupplierInput"
      responses:
        "200":
          description: Supplier deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  updatedProducts:
                    type: number
        "404":
          $ref: "#/components/responses/NotFound"
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          $ref: "#/components/responses/BadRequest"
  /clients/{id}:
    put:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "200":
          description: Client updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update product details
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "204":
          description: Product deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /products/{id}/inventory:
    post:
      operationId: addInventory
      tags: [products]
      summary: Add inventory units
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryInput"
      responses:
        "200":
          description: Inventory updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /products/demo:
    delete:
      operationId: deleteDemoProducts
      tags: [products]
      summary: Delete seeded demo products
      responses:
        "204":
          description: Demo products deleted
  /dashboard:
    get:
      operationId: getDashboard
      tags: [reports]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
    patch:
      operationId: updateDeudaMoises
      tags: [reports]
      summary: Update the debt value of Moises David (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeudaMoisesInput"
      responses:
        "204":
          description: Debt updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Only the owner can update the debt
  /sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: List sales
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [today, last7, thisMonth, previousMonth, all]
            default: all
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: scope
          in: query
          required: false
          description: company filtra por empresa actual, all retorna de todas las empresas
          schema:
            type: string
            enum: [company, all]
            default: company
      responses:
        "200":
          description: Sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
    post:
      operationId: createSale
      tags: [sales]
      summary: Register a sale and update inventory atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Sale registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Insufficient inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sales/{id}:
    get:
      operationId: getSale
      tags: [sales]
      summary: Get sale details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchSaleDetails
      tags: [sales]
      summary: Update payment method or notes of a sale
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paymentMethod:
                  type: string
                  nullable: true
                notes:
                  type: string
                  nullable: true
                deliveryPaid:
                  type: boolean
                  description: Marca si el mensajero ya recibió el pago del domicilio
      responses:
        "200":
          description: Updated sale
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: number
                  paymentMethod:
                    type: string
                    nullable: true
                  notes:
                    type: string
                    nullable: true
                  deliveryPaid:
                    type: boolean
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSale
      tags: [sales]
      summary: Delete a sale and return its items to inventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "204":
          description: Sale deleted and inventory restored
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /sales/{id}/credit-payment:
    post:
      operationId: createCreditPayment
      tags: [sales]
      summary: Register a credit payment for a sale
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditPaymentInput"
      responses:
        "201":
          description: Credit payment registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditPayment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /sales/{id}/credit-payments:
    get:
      operationId: listCreditPayments
      tags: [sales]
      summary: List credit payments for a sale
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Credit payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreditPayment"
        "400":
          $ref: "#/components/responses/BadRequest"
  /purchases:
    get:
      operationId: listPurchases
      tags: [purchases]
      summary: List purchases
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [today, last7, thisMonth, previousMonth, all]
            default: all
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Purchases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Purchase"
    post:
      operationId: createPurchase
      tags: [purchases]
      summary: Register a purchase and update inventory atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseInput"
      responses:
        "201":
          description: Purchase registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "400":
          $ref: "#/components/responses/BadRequest"
  /purchases/import:
    post:
      operationId: importPurchases
      tags: [purchases]
      summary: Import purchases from a file, matching or creating products by name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseImportInput"
      responses:
        "201":
          description: Purchases imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
  /purchases/{id}:
    get:
      operationId: getPurchase
      tags: [purchases]
      summary: Get purchase details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Purchase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePurchase
      tags: [purchases]
      summary: Delete a purchase and remove its items from inventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "204":
          description: Purchase deleted and inventory reverted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /reports/inventory:
    get:
      operationId: getInventoryReport
      tags: [reports]
      summary: Get inventory report
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [all, low, empty]
            default: all
      responses:
        "200":
          description: Inventory report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryReport"
  /reports/sales:
    get:
      operationId: getSalesReport
      tags: [reports]
      summary: Get sales report
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [today, last7, thisMonth, previousMonth, all]
            default: all
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Sales report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesReport"
  /stockouts:
    get:
      operationId: listStockouts
      tags: [reports]
      summary: List stockouts (bajas de inventario) for a month
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            description: Filtro por mes (YYYY-MM); si no se envía, retorna todos
      responses:
        "200":
          description: Stockouts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stockout"
    post:
      operationId: createStockout
      tags: [reports]
      summary: Register a stockout session (several products) and deduct stock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockoutInput"
      responses:
        "201":
          description: Stockout registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stockout"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /stockouts/{id}:
    delete:
      operationId: deleteStockout
      tags: [reports]
      summary: Anular una baja completa y devolver el stock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Stockout deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /stockouts/{id}/items/{itemId}:
    patch:
      operationId: updateStockoutItem
      tags: [reports]
      summary: Editar un item de una baja (cantidad, costo, motivo, nota)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: itemId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockoutItemInput"
      responses:
        "200":
          description: Stockout item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockoutItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteStockoutItem
      tags: [reports]
      summary: Eliminar un item de una baja y devolver su stock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: itemId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Stockout item deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /manual-credits:
    get:
      operationId: listManualCredits
      tags: [sales]
      summary: List manual credit entries
      parameters:
        - name: scope
          in: query
          required: false
          description: company filtra por empresa actual, all retorna de todas las empresas
          schema:
            type: string
            enum: [company, all]
            default: company
      responses:
        "200":
          description: Manual credits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManualCredit"
    post:
      operationId: createManualCredit
      tags: [sales]
      summary: Create a manual credit entry for past debts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualCreditInput"
      responses:
        "201":
          description: Manual credit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualCredit"
        "400":
          $ref: "#/components/responses/BadRequest"
  /credit-payments/last:
    get:
      operationId: listLastCreditPayments
      tags: [customers]
      summary: List the most recent credit payment per credit sale and manual credit for the company
      responses:
        "200":
          description: Last credit payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LastCreditPayment"
  /credit-payments/{id}:
    delete:
      operationId: deleteCreditPayment
      tags: [customers]
      summary: Delete a credit payment (abono)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /manual-credits/{id}:
    delete:
      operationId: deleteManualCredit
      tags: [sales]
      summary: Delete a manual credit entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /manual-credits/{id}/credit-payment:
    post:
      operationId: createManualCreditPayment
      tags: [sales]
      summary: Register a payment on a manual credit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditPaymentInput"
      responses:
        "201":
          description: Payment registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditPayment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /manual-credits/{id}/credit-payments:
    get:
      operationId: listManualCreditPayments
      tags: [sales]
      summary: List payments for a manual credit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreditPayment"
components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: number
        minimum: 1
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Company:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        slug:
          type: string
        nit:
          type: ["string", "null"]
          description: NIT de la empresa
        address:
          type: ["string", "null"]
          description: Dirección de la empresa
        phone:
          type: ["string", "null"]
          description: Teléfono de la empresa
        allowNegativeStock:
          type: boolean
          description: Permite registrar ventas incluso sin inventario suficiente
      required: [id, name, slug, allowNegativeStock]
    SupplierSummary:
      type: object
      properties:
        id:
          type: number
          nullable: true
        code:
          type: string
          nullable: true
          description: Código visible del proveedor (ej. PRV-001)
        name:
          type: string
        contact:
          type: string
          nullable: true
          description: Persona de contacto o referente
        phone:
          type: string
          nullable: true
          description: Número de contacto
        city:
          type: string
          nullable: true
          description: Ciudad de origen
      required: [id, code, name]
    SupplierInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        contact:
          type: string
          description: Persona de contacto o referente
        phone:
          type: string
          description: Número de contacto
        city:
          type: string
          description: Ciudad de origen
      required: [name]
    UpdateSupplierInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        newName:
          type: string
          description: Nuevo nombre si se renombra
        contact:
          type: string
          nullable: true
          description: Persona de contacto o referente (null para borrar)
        phone:
          type: string
